name: Verify book sources and web edition
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run check
      - name: Recover exact historical source objects from retained Git history
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, subprocess
          origin='f6997bf2c2f65683505ed719d8038f428b952de1'
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'ai-ontology-original-history'
          target.mkdir()
          bundles=[
            ('continuity-pilot-history.bundle','53ec03ca8ab5e77e2fcfff23206ad6bce26ec0ace9b2168bf81b26b44151a45e','HEAD'),
            ('reading-transfer-history.bundle','c3e362dfdeda179d3bc0db880b1eb28ef5107e8e0cad7cc491eafebb5ddcbea0','refs/heads/research/reading-transfer-source'),
            ('handoff-repair-history.bundle','2104c5d9675ff90b67e7d476eaf412ff0cfe143ef444f577a01eeee13e3970a3','refs/heads/snapshot/handoff-repair-inputs'),
          ]
          for name,digest,ref in bundles:
            raw=subprocess.check_output(['git','show',origin+':research/'+name])
            if hashlib.sha256(raw).hexdigest()!=digest:
              raise ValueError('historical bundle hash mismatch: '+name)
            path=target/name
            path.write_bytes(raw)
            subprocess.run(['git','bundle','verify',str(path)],check=True,capture_output=True)
            subprocess.run(['git','fetch','--quiet','--no-tags',str(path),ref],check=True,capture_output=True)
          print('Recovered three hash-verified historical source archives for local checking only; no artifact upload.')
          PY
      - run: python3 -m unittest discover -s scripts -p test_claim_history.py -q
      - run: python3 -m unittest discover -s examples -v
      - run: python3 -m unittest audit.test_audit -q
      - run: python3 -O -m unittest audit.test_audit -q
      - run: python3 -m unittest audit.test_langgraph_checkpoint -q
      - run: python3 ontology/export.py --check
      - run: python3 -m unittest discover -s ontology -p 'test_*.py' -q
      - run: python3 -m unittest discover -s research/closed_loop -q
      - run: python3 -W error::ResourceWarning -m unittest discover -s research/epistemic_return -p 'test_*.py' -q
      - run: python3 -O research/epistemic_return/analyze.py
      - run: python3 research/epistemic_return_diagnosis.py
      - name: Regrade separate scoped-contract reproduction without models
        run: python3 -I -S -B research/scoped_clearance/verify_projection.py research/scoped_clearance/projection.json.gz
      - name: Regrade saved induction forecasts without executing candidates
        run: python3 -I -S -B research/program_induction/verify_projection.py
      - run: python3 -O -m unittest discover -s research/program_induction -p 'test_projection.py' -q
      - name: Regrade saved same-information forecasts without executing candidates
        run: python3 -I -S -B research/forecast_calibration/verify_projection.py
      - run: python3 -O -m unittest discover -s research/forecast_calibration -p 'test_projection.py' -q
      - run: git diff --exit-code -- research/epistemic_return/results.json research/epistemic-return-diagnosis.json
      - run: python3 -O research/closed_loop/analyze.py
      - run: git diff --exit-code -- research/closed_loop/results.json
      - run: python3 -m unittest discover -s research/continuity_pilot -q
      - run: python3 -m unittest discover -s research/continuity_pilot_v2 -q
      - run: python3 -m unittest discover -s research -p 'test_integrity.py' -q
      - run: python3 -m unittest discover -s research/engineering_cases -q
      - run: python3 -m unittest discover -s research/participation_pilot -q
      - run: python3 -m unittest discover -s research -p 'test_participation_verifier.py' -q
      - run: python3 research/verify_studies.py
      - run: python3 research/verify_participation.py
      - run: python3 -m unittest discover -s research/gpt_profile_pilot -q
      - run: python3 -m unittest discover -s research/gpt_profile_pilot_v2 -q
      - run: python3 -m unittest discover -s research -p 'test_gpt_integrity.py' -q
      - run: python3 research/verify_gpt_profiles.py gpt_profile_pilot
      - run: python3 research/verify_gpt_profiles.py gpt_profile_pilot_v2
      - run: python3 -m unittest discover -s research/transfer_calibration -q
      - run: python3 -m unittest discover -s research/transfer_calibration_v2 -q
      - run: python3 -m unittest discover -s research/transfer_calibration_v3 -q
      - run: python3 -m unittest discover -s research/transfer_reading -q
      - run: python3 -O research/verify_transfer_calibration.py transfer_calibration
      - run: python3 -O research/verify_transfer_calibration.py transfer_calibration_v2
      - run: python3 -O research/verify_transfer_calibration.py transfer_calibration_v3
      - run: python3 -O research/verify_reading_transfer.py
      - run: python3 -m unittest discover -s research -p 'test_reading_integrity.py' -q
      - run: python3 -m unittest discover -s research/handoff_repair -q
      - run: python3 -O research/verify_handoff_repair.py
      - run: python3 -m unittest discover -s research -p 'test_handoff_repair_integrity.py' -q
      - run: python3 -m unittest discover -s research/handoff_controls -q
      - run: python3 -O research/verify_handoff_controls.py
      - name: Verify recovered original handoff provenance
        run: |
          python3 - <<'PY'
          import os,pathlib,subprocess
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'ai-ontology-original-history/handoff-repair-history.bundle'
          subprocess.run(['git','bundle','verify',str(path)],check=True,capture_output=True)
          print('Original handoff bundle verified in temporary CI storage.')
          PY
      - run: git diff --exit-code -- BOOK_UA.md BOOK_EN.md docs/index.html docs/en/index.html docs/research/index.html docs/ontology/index.html docs/downloads/BOOK_UA.md docs/downloads/BOOK_EN.md docs/edition.json docs/en-edition.json docs/discovery.json docs/sitemap.xml docs/llms.txt docs/note
  langgraph-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 -m pip install -r examples/integrations/requirements-langgraph.txt
      - run: python3 -B -m unittest audit.test_langgraph_checkpoint -q
      - name: Capture and audit an authored native run without models
        run: |
          python3 -B examples/integrations/langgraph_checkpoint.py > "$RUNNER_TEMP/langgraph-checkpoints.json"
          python3 -m audit.cli report "$RUNNER_TEMP/langgraph-checkpoints.json" --format langgraph > "$RUNNER_TEMP/langgraph-audit.json"
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["status"]=="no-recorded-effects" and r["counts"]=={"nodes":4,"edges":0} and not any(r["queries"].values())' "$RUNNER_TEMP/langgraph-audit.json"
