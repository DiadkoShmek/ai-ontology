name: Verify book sources and web edition
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm run build
      - run: npm run check
      - run: git diff --exit-code -- BOOK_UA.md docs/index.html docs/downloads/BOOK_UA.md docs/edition.json
